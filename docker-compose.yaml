services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build: .
    container_name: rate-limiter-app
    ports:
      - "8080:8080"
    environment:
      WEB_SERVER_PORT: 8080
      RATE_LIMIT_STORE: redis
      REDIS_ADDR: redis:6379
      RATE_LIMIT_IP: 10
      RATE_LIMIT_TOKENS: "abc123:100,def456:5"
      RATE_LIMIT_WINDOW: 1s
      RATE_LIMIT_BLOCK_DURATION: 5m
    depends_on:
      redis:
        condition: service_healthy

  # Roda a suíte completa, incluindo os testes de integração contra o Redis.
  # Serviço separado para não pesar na subida normal: docker compose run --rm test
  test:
    image: golang:1.26-alpine
    working_dir: /src
    volumes:
      - .:/src
    environment:
      REDIS_TEST_ADDR: redis:6379
    command: go test ./... -v
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - test
